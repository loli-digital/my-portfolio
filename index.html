<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="canonical" href="https://loli-digital.github.io/my-portfolio/" />
    <!-- Favicon -->
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      href="%BASE_URL%favicon-32x32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="%BASE_URL%favicon-16x16.png"
      sizes="16x16"
    />
    <!-- CSP (Content Security Policy) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    img-src 'self' data:;
    style-src 'self' 'unsafe-inline';
    script-src 'self';
    font-src 'self' data:;
    frame-ancestors 'none';
  "
    />
    <!-- Basic Meta Labels -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de Loli Guerrero, Frontend Developer especializada en crear webs modernas, responsive y accesibles con React, TypeScript, Tailwind, Sass y tecnologías actuales"
    />
    <meta name="author" content="Loli Guerrero" />
    <meta name="robots" content="index, follow" />
    <title>Loli Guerrero | Frontend Developer</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Loli Guerrero | Frontend Developer" />
    <meta
      property="og:description"
      content="Portfolio de Loli Guerrero, Frontend Developer especializada en crear webs modernas, responsive y accesibles con React, TypeScript, Tailwind, Sass y tecnologías actuales"
    />
    <meta
      property="og:url"
      content="https://loli-digital.github.io/my-portfolio/"
    />
    <meta
      property="og:image"
      content="https://loli-digital.github.io/my-portfolio/og-image.png"
    />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Loli Guerrero | Frontend Developer" />
    <meta
      name="twitter:description"
      content="Portfolio de Loli Guerrero, Frontend Developer especializada en crear webs modernas, responsive y accesibles con React, TypeScript, Tailwind, Sass y tecnologías actuales"
    />
    <meta
      name="twitter:image"
      content="https://loli-digital.github.io/my-portfolio/og-image.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
